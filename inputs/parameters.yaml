# Model parameters: the modelling assumptions other than technology costs, and the physical
# constants, each with its source.
#
# Elsewhere: technology costs, lifetimes, efficiencies, water use and the water source price in
# tech/; what differs between runs (time step, land share, finance, which tables) in
# ../runs.yaml. model/parameters.py reads this file; the land, geography and
# site-cost tables and the run manifests record its hash, and tests/test_parameters.py checks
# that the model reads every value. Full references: README.md (this folder),
# ../CAMPAIGN_PLAN.md (References) and ../data/README.md.

plant:
  # The ammonia output the plant is solved for. The model is linear, so designs and capacities
  # scale with it; it also sizes the water pipeline (site_costs.water_pipeline)
  reference_output_mt_per_year: 1.0

land:
  # Share of each IGBP land-cover class (MODIS MCD12C1, Land Cover Type 1) that each technology
  # may use, after Salmon and Banares-Alcantara (2022, Table 1) and Verschuur et al. (2024);
  # unlisted classes give none. Wind coexists with farming; PV excludes cropland but takes a
  # rooftop share of urban land.
  #   0 water; 1-5 forests; 6 closed shrublands; 7 open shrublands; 8 woody savannas;
  #   9 savannas; 10 grasslands; 11 permanent wetlands; 12 croplands; 13 urban and built-up;
  #   14 cropland and natural vegetation mosaics; 15 snow and ice; 16 barren; 17 unclassified
  wind_class_availability:
    0: 1.0  # water: offshore wind only, which the campaign leaves out
    6: 0.5
    7: 0.5
    8: 0.2
    9: 0.2
    10: 0.2
    12: 0.05
    14: 0.05
    16: 1.0
  solar_class_availability:
    6: 0.5
    7: 0.5
    8: 0.2
    9: 0.2
    10: 0.2
    13: 0.03  # rooftop PV
    16: 1.0
  # Protected land: WDPA polygons (February 2026) of these statuses and realms are excluded
  # (inputs/site_costs/protected_areas.csv, model/protected_areas.py)
  protected_area_statuses: [designated, inscribed, established]
  protected_area_realms: [terrestrial, coastal]
  # Slope classes of the land tables, upper bounds in degrees (GEBCO 2025): no build-cost uplift
  # up to 8.5 degrees (15 % grade, the limit of standard single-axis trackers); land above the
  # last bound is excluded (decided 7 October 2026, CAMPAIGN_PLAN.md section 0a; the September
  # tables excluded land above 15 degrees)
  slope_class_upper_deg: [8.5, 14.0, 20.0]
  # Wind farm footprint per GW, for turbine spacing (Salmon et al. 2021)
  wind_land_use_km2_per_gw: 200.0
  # Fixed-tilt PV density: First Solar Series 6 modules (2018) packed in rows that do not shade
  # each other at noon on the winter solstice, as in van de Ven et al. (2021); tilt equal to the
  # latitude within the bounds, the ground cover ratio within its bounds
  solar_module_width_m: 1.21
  solar_module_length_m: 2.06
  solar_module_power_kw: 0.45
  solar_min_tilt_deg: 15.0
  solar_max_tilt_deg: 55.0
  solar_min_sun_altitude_deg: 5.0
  solar_min_ground_cover_ratio: 0.05
  solar_max_ground_cover_ratio: 0.8

# The cells a campaign solves (land_table.run_cells, on the 100 % land table): at least this
# share of land, this much area suitable for PV or wind, north of this latitude (no
# Antarctica). The rule gives exactly the 16,509 cells of the September key runs.
run_cells:
  min_land_pct: 0.1
  min_suitable_km2: 1.0
  south_limit_deg: -60.0

weather:
  # Wind output after wake losses inside the farm: the legacy model's factor (wake_losses in
  # Salmon's p_location_class.py, legacy_lcoa/source/)
  wind_wake_factor: 0.93
  # Land correction of the wind of cells with water (model/weather_land.py, 8 October 2026)
  land_correction:
    # cells with less land than this share (at least 1 % water) are corrected
    full_land_share: 0.99
    # month-hour bins whose whole-cell ERA5 wind is below this capacity factor take the cell's
    # annual ratio instead of their own
    calm_capacity_factor: 0.02
    # neighbours with at least this land share count as fully inland for the floor
    inland_land_share: 0.99
  # One-degree profiles from the ERA5 2019 cutout on ARC (model/weather_profiles.py;
  # CAMPAIGN_PLAN.md section 7a, agreed 3 November 2026). Wind: an atlite 0.4.1 reference turbine
  # with its wind speeds stretched to the specific power of DEA 2050's turbine (output per unit of
  # capacity below rated power depends on wind speed cubed over specific power, so V x (DEA /
  # reference)^(1/3) keeps the reference curve's power coefficient and moves rated power to DEA's
  # wind speed), at DEA's hub height. DEA: technology_data_for_el_and_dh, sheets "20 Onshore
  # turbines" and "21 Offshore Wind AC Fixed", 2050 column.
  profiles:
    wind_onshore:
      reference_turbine: NREL_ReferenceTurbine_2020ATB_7MW
      reference_power_mw: 7.0
      reference_rotor_m: 200.0
      power_mw: 6.0
      rotor_m: 165.0
      hub_height_m: 110.0
    wind_offshore:
      reference_turbine: NREL_ReferenceTurbine_2020ATB_15MW_offshore
      reference_power_mw: 15.0
      reference_rotor_m: 240.0
      power_mw: 35.0
      rotor_m: 380.0
      hub_height_m: 220.0
    # atlite's smoothing of the power curve, on land and at sea, for wind speeds varying within a
    # grid cell (Hörsch et al. 2018, eq. 8, its parameters fitted to Danish feed-in)
    smooth_power_curve: true
    # wind speeds x (rho / rho0)^(1/3) before the power curve, the IEC 61400-12-1 normalisation for
    # pitch-regulated turbines, with the density of the standard atmosphere (ISO 2533) at the
    # point's height plus the hub height
    air_density_correction: true
    # PV: atlite's crystalline silicon panel (Huld et al. 2010; inverter efficiency 0.9 in the
    # panel file), fixed at the latitude-optimal tilt and single-axis tracking (north-south axis);
    # output per MW of AC, the basis of DEA's PV costs (sheet "22 Utility-scale PV", 0.29 MEUR per
    # MW of AC): atlite's output per MW of modules x DEA's sizing factor (DC/AC), capped at 1
    pv_panel: CSi
    pv_orientation: latitude_optimal
    pv_tracking: horizontal
    dc_ac_ratio: 1.25

# Plants at sea (CAMPAIGN_PLAN.md section 7d; decided 30 October and 3 November 2026): wind only,
# the plant at the site, so without DEA's substation and export cable. Costs in EUR2020, the 2050
# column of DEA's electricity catalogue (chapter 21 and its data sheets)
offshore:
  # A cell holds a sea plant if this share of it is sea, the share at which a cell's land weights
  # start (weather.land_correction.full_land_share). Frozen sea counts as sea: the cold rule
  # (site_costs.cold) prices it, and nothing is left out for ice
  min_sea_share: 0.01
  # Protected water: the WDPA polygons of land.protected_area_statuses in these realms are left
  # out of the sea a plant may use, as those of land.protected_area_realms are on land
  protected_area_realms: [marine, coastal]
  # Fixed foundations "can be used in water depths of up to 70 metres" (DEA p. 208); floating
  # beyond, water deeper than 1,000 m excluded from NREL's floating resource (Musial et al. 2016)
  fixed_max_depth_m: 70.0
  floating_max_depth_m: 1000.0
  turbine_eur_per_mw: 750000.0
  array_cables_eur_per_mw: 40000.0
  development_eur_per_mw: 160000.0
  # DEA's foundation at its reference depth, scaled by DEA's function of depth (Table 15, p. 225;
  # calibrated on 20-50 m, Table 11)
  fixed_foundation:
    eur_per_mw_at_reference: 334000.0
    reference_depth_m: 30.0
    function_base_eur_per_mw: 450000.0
    function_eur_per_mw_per_m: 5000.0
  floating_foundation_eur_per_mw: 675000.0
  # Every technology but wind, by depth class. fixed: a jacket platform is 42 % of a 300 t/d
  # offshore plant's capital cost (Brener 2022, MSc thesis, Oxford), x1.72. floating: a process
  # plant on a moored hull at the first-of-a-kind level of floating LNG (Scott 2018; Rystad 2025).
  # deep: on ships, speculative; floating wind at 500 m and 1,000 km from shore is 2.5-3.5 times
  # onshore (Salmon and Bañares-Alcántara 2022, Table 2)
  plant_multiplier:
    fixed: 1.72
    floating: 2.0
    deep: 3.0
  # In deep water wind too is its onshore cost times this
  deep_wind_multiplier: 3.0
  # Finance runs. International waters take the highest rate in Ameli et al.'s (2021) table, that
  # of their Africa region: no state's legal framework, insurance or offtake support (decided 30
  # October 2026). Ameli's table has no row for these small states, whose zones hold sea cells;
  # its rates are regional, so each takes the rate of the region it lies in
  international_waters_interest_rate: 0.118
  ameli_region_of_small_states:
    AFR: [COM, CPV, MUS, STP, SYC]
    CSA: [ATG, BRB, DMA, GRD, KNA, LCA, VCT]
    MEA: [BHR]
    ODA: [FSM, KIR, MDV, MHL, NRU, PLW, TON, TUV, WSM]
    WEU: [MLT]

# Water sources (CAMPAIGN_PLAN.md section 0b; decided 7 and 9 October 2026): a cell holds a source
# if the sea and permanent lakes and reservoirs cover at least standing_min_share of it, or large
# rivers river_min_share. The columns are those of site_costs/cell_geography.csv, from the Global
# Lakes and Wetlands Database v2 (Lehner et al. 2025): fresh lakes 01, saline lakes 02,
# reservoirs 03, large rivers 04-05, other permanent water 06. Ephemeral water (20, 21) and salt
# pans (32) are not sources.
water_sources:
  standing_columns: [sea_km2, fresh_lake_km2, saline_lake_km2, reservoir_km2, other_permanent_water_km2]
  standing_min_share: 0.10  # the share the spatial inputs used before
  river_columns: [large_river_km2]
  river_min_share: 0.01  # about 120 km2 at the equator: a river about 1 km wide across the cell
  # A saline lake counts only where the JRC Global Surface Water occurrence layer (Pekel et al.
  # 2016, version 1.4) shows water in at least this percentage of observations; dry salt lakes
  # such as Kati Thanda-Lake Eyre fail
  saline_lake_min_occurrence_pct: 50

site_costs:
  # Remote factor, one rule for every point on land and at sea (decided 3 November 2026):
  # 1 + (f - 1) log2(1 + d) / log2(1 + anchor_days), d the travel time in days from a city of
  # city_size people, f the factor at the anchor. The anchor is Shamattawa, Manitoba, "only
  # accessible by air and winter road": x1.99 on Winnipeg, of which transportation 1.60 (DIAND
  # Cost Reference Manual, Real Property Services for INAC, July 1996, pp. 1-15 and 1-16), and
  # 20.4 hours from a city of 20,000 on the Nelson et al. (2019) raster. Rounded to x2 on the
  # build part and x1.6 on equipment, as a sensitivity factor rather than a case study
  remote_factor:
    city_size: 20k
    anchor_days: 0.85
    build_at_anchor: 2.0
    equipment_at_anchor: 1.6
    # Where the raster has no value, and at sea, the travel time is the nearest port's plus the
    # sea leg at this speed (Salmon and Bañares-Alcántara 2022)
    sea_speed_km_per_h: 20.0
    # At sea the leg counts beyond this distance: DEA's offshore costs other than substations
    # and export cables are about the same at 175 km as at 60 km (1.31 and 1.28 MEUR/MW), so
    # marine installation to 175 km is in DEA's costs
    sea_leg_included_km: 175.0
  # Cold rule (decided 3 November 2026): every technology, equipment and build parts alike, costs
  # this much more at or beyond the latitude, or at or above the elevation. Yamal LNG adjusted to
  # Corpus Christi's scope is 25 % higher, "reflecting the higher construction costs in the harsh
  # arctic environment" (Songhurst 2018, OIES NG137, Appendix 5, p. 40). 3,000 m is about 20 C
  # colder than sea level at 6.5 C per km, roughly the drop from the subtropics to 60 degrees
  cold:
    multiplier: 1.25
    min_abs_latitude_deg: 60.0
    min_elevation_m: 3000.0
  # Build-cost factor of each slope class (land.slope_class_upper_deg): none up to 8.5 degrees,
  # then the middle of NREL's hilly (1.1-1.5) and mountainous (1.2-2.0) cost multipliers for
  # transmission lines (Lopez et al. 2025, Table 12), applied by analogy, since no published
  # multiplier covers wind or solar farms by slope; decided 7 October 2026
  slope_class_factors: [1.0, 1.3, 1.6]
  # The technologies whose build cost the slope factor scales
  slope_techs: [solar, solar_tracking, wind]
  # Water depth and labour (wage level by country) multipliers: 1, since the campaign is onshore
  # and finance differences are the finance table's
  depth_multiplier: 1.0
  labour_multiplier: 1.0
  # Water pipeline from the nearest source: the Texas Water Development Board's Uniform Costing
  # Model (HDR and Freese and Nichols 2018, User's Guide v2.0, Appendix C, Tables 1 and 3;
  # December 2017 dollars), sized for the reference plant's flow at the tech YAML's water use
  water_pipeline:
    # Pipe with appurtenances, rural, in soil: USD per metre by diameter (mm), converted from
    # UCM's USD per foot by diameter in inches (given after each value)
    rural_soil_usd_per_m:
      152.4: 78.740157  # 6 in, 24 USD/ft
      203.2: 124.671916  # 8 in, 38 USD/ft
      254.0: 170.603675  # 10 in, 52 USD/ft
      304.8: 213.254593  # 12 in, 65 USD/ft
      355.6: 259.186352  # 14 in, 79 USD/ft
      406.4: 301.837270  # 16 in, 92 USD/ft
      457.2: 347.769029  # 18 in, 106 USD/ft
      508.0: 393.700787  # 20 in, 120 USD/ft
      609.6: 482.283465  # 24 in, 147 USD/ft
    pipe_engineering_contingency: 0.30  # engineering, legal and contingencies: pipes
    other_engineering_contingency: 0.35  # the same: all other facilities
    # Environmental studies and mitigation, pipelines: converted from 25,000 USD per mile
    environmental_usd_per_km: 15534.28
    # The smallest booster station of the capacity table (5 million US gallons, 18,900 m3, a day)
    booster_station_usd: 2760000.0
    pipe_om_fraction: 0.01  # O&M per year, share of capital
    pump_om_fraction: 0.025
    power_usd_per_kwh: 0.08  # power cost of the 2021 Texas regional water plans
    hazen_williams_c: 120.0
    # Lift of a booster station, metres of water: converted from UCM's 200 psi pipe pressure
    # class less a 25 psi residual pressure (175 psi, 1,207 kPa)
    booster_lift_m: 123.037
    pump_efficiency: 0.75
    # Annuity: the 5 % rate of the uniform-finance runs; 45 years for pipes (as the
    # district-heating proxy the pipeline replaced) and 20 for pump stations (UCM's debt period)
    discount_rate: 0.05
    pipe_lifetime_years: 45.0
    pump_lifetime_years: 20.0
    # Price years for the currency rule (currency, below): the unit costs are in December 2017
    # dollars (the UCM guide's appendix), taken as 2017; the power cost is the guidance of the
    # 2021 planning cycle, whose base costs are in September 2018 dollars. Until 30 October 2026
    # the unit costs were brought to 2020 with the US CPI-U and the power cost was not converted.
    unit_cost_price_year: 2017
    power_price_year: 2018
    # Share of the pipeline's capital that is materials, which takes the equipment multiplier;
    # the rest takes the cell's build multiplier (DEA Technology Data for Energy Transport,
    # district-heating transmission line 113)
    materials_share: 0.30

# Currency. The model works in euros of 2020. A cost stated in another currency or price year
# is converted at the ECB's annual average rate of its price year, then brought to 2020 with the
# euro-area HICP: the rule green-caribou uses, shared since 30 October 2026
# (model.parameters.eur2020_per). The ammonia tank's USD2017 in the DEA technology YAML follows
# it. Costs enter the optimisation linearly, so the results in another currency or year are the
# EUR2020 results divided by one factor, with the same plant design.
currency:
  # US dollars per euro, ECB euro reference rate, annual average (ECB Data Portal, series
  # EXR.A.USD.EUR.SP00.A); 2020 to the precision of the technology YAMLs' 0.875506
  usd_per_eur:
    2017: 1.1297
    2018: 1.1810
    2019: 1.1195
    2020: 1.142196
  # Euro-area HICP, annual average rate of change (Eurostat, prc_hicp_aind)
  eur_inflation:
    2018: 0.018
    2019: 0.012
    2020: 0.003

# Physical constants with a source
physical:
  earth_radius_km: 6371.0  # mean radius; cell areas and distances treat the Earth as a sphere
  earth_axial_tilt_deg: 23.44  # the sun's declination at the solstices (PV row spacing)
  # Higher heating values that convert energy flows to tonnes: 141.8 and 22.5 MJ/kg, the legacy
  # model's values (legacy_lcoa/source/94de8ce/main.py and p_auxiliary.py)
  hydrogen_hhv_mwh_per_t: 39.4
  ammonia_hhv_mwh_per_t: 6.25
  # Pumping energy of the water pipeline
  gravity_m_per_s2: 9.81
  water_density_kg_per_m3: 1000.0
