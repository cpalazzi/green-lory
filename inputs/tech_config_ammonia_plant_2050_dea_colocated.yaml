# DEA 2050 technology costs with the land-use conventions adopted on 16 September 2026
# (co-located wind and PV; tracking footprint from Bolinger & Bolinger 2022).
#
# Everything else (costs, lifetimes, efficiencies, 2 USD2020/m3 baseline water, 1.5 m3/t)
# comes from tech_config_ammonia_plant_2050_dea.yaml.  Finance is supplied per cell by
# the interest-only override CSV of the campaign (uniform 5 % or Ameli reduced WACC).
extends: tech_config_ammonia_plant_2050_dea.yaml
# Uniform baseline water price of 2.0 EUR2020 per m3 (decision of 23 Sep 2026: the model
# currency is EUR).  The site-cost pipeline keeps the spatial input currency (USD2020), so the
# value is entered as 2.0 / 0.875506 = 2.28439325 USD2020 per m3 (ECB 2020 average rate).
water_cost_baseline_usd_per_m3: 2.28439325
techs:
  solar_tracking:
    # Land use per MW relative to fixed tilt: Bolinger & Bolinger (2022, IEEE J.
    # Photovoltaics 12(2), doi:10.1109/JPHOTOV.2021.3136805), 2019 median direct-array
    # power density 0.35 MWdc/acre fixed-tilt versus 0.24 MWdc/acre single-axis
    # tracking, i.e. tracking needs 0.35/0.24 = 1.4583 times the fixed-tilt area.
    # The fixed density itself is the latitude-adjusted value carried by the land table.
    land_use_km2_per_mw: 0.0145833333333333
  wind:
    # Fraction of the wind footprint (turbine spacing, 0.2 km2/MW) that excludes
    # co-located PV: Denholm et al. (2009, NREL/TP-6A2-45834, Table 1) direct impact
    # 1.0 +/- 0.7 ha/MW of 34.5 +/- 22.4 ha/MW total.  Used by the colocated land
    # allocation; ignored under exclusive.  TODO: better co-location reference.
    land_use_exclusive_fraction: 0.03
