# Canonical technology cost inputs for the basic ammonia plant — 2050 DEA scenario.
# Built on the DEA 2030 case ("the 2030 YAML" below: the Calliope model's techs_dea.yaml,
# tech_config_ammonia_plant_2030_dea.yaml until 9 October 2026, in git history); cost values
# taken directly from the DEA reference datasheets for the 2050 projection year.
#
# Source files (DEA data sheets, linked from Zotero in references/, untracked):
#   Solar, Solar tracking, Wind:
#     technology_data_for_el_and_dh - 0017_1 (1).xlsx
#       → "22 Utility-scale PV", "22 Utility-scale PV tracker", "20 Onshore turbines"
#   Electrolysis:
#     data_sheets_for_renewable_fuels (2).xlsx → "1.1 AEC 1 GW"
#   Ammonia synthesis:
#     data_sheets_for_renewable_fuels (2).xlsx → "5.4 Hydrogen to Ammonia"
#   Battery:
#     Technology_datasheet_for_energy_storage – 0010 (2).xlsx → "180 Lithium Ion Battery"
#   H2 tanks and hydrogen compressor:
#     Technology_datasheet_for_energy_storage – 0010 (2).xlsx → "151a Hydrogen Storage - Tanks"
#   Ammonia tank: IEA (2019), The Future of Hydrogen, assumptions annex, p. 7 (import terminal),
#     as in green-caribou
#
# Values aligned with green-caribou (green_caribou/analytical_inputs.py) on 29 October 2026:
# electrolyser efficiency and O&M, battery cost split, hydrogen tank and compressor, ammonia tank;
# the compressor's lifetime and O&M on 30 October 2026.
# All in EUR2020; the DEA workbooks are already in 2020 prices (their August 2023 update).
# Methodology:
#   Generators: total investment and component breakdown read directly from DEA 2050
#     column. tech_cost = equipment-centric rows; build_cost = civil/install/soft/grid.
#   Links: DEA gives EUR/kW_input for electrolysis (converted to output basis via HHV
#     efficiency), cost per t/day of ammonia for ammonia synthesis and EUR/kW of hydrogen
#     output for the compressor (both converted to the HHV buses below); DEA's power
#     component per MW for the battery PCS.
#   Stores: DEA component costs read directly (battery: energy component plus all other
#     project costs, DEA note M; H2 tanks: tanks + installation rows, corrected for the sheet's
#     double price update).
#
# Energy basis: the hydrogen and ammonia buses are on HHV (39.4 kWh/kg H2, 6.25 MWh/t NH3).
# DEA states hydrogen on LHV (33.3 kWh/kg) and ammonia on LHV (5.24 MWh/t), so DEA costs per
# unit of hydrogen or ammonia are converted (campaign check D9, 14 October 2026).
#
# The hydrogen fuel cell has no DEA 2050 data and retains 2030 values. Efficiency and carrier
# coefficients updated where DEA provides 2050 values.
#
# Pressure: the electrolyser delivers hydrogen at about 30 bar, as the DEA catalogue assumes
# (renewable fuels, chapter 1.1, p. 30: "both AEC and PEMEC technology can deliver hydrogen at
# pressures as high as 30 bar, which can be sufficient for many Power-to-X (PtX) applications
# (e.g., ammonia ..."; sheet 5.4, note C: "Assumption of higher pressure electrolysis"). So
# ammonia synthesis takes it without a feed compressor, and the storage compressor raises it
# from 30 to 200 bar. Decided on 30 October 2026 for green-lory and green-caribou.
#
# All costs are EUR per MW (power devices) or per MWh (energy storage) overnight CAPEX.
# For link components, enter costs on an output (bus1) basis.

currency: EUR
model_currency_price_year: 2020
spatial_cost_currency: USD
spatial_cost_price_year: 2020
# ECB 2020 average: 1 EUR = 1.142196 USD.
spatial_cost_to_model_currency: 0.875506

# Global water and land cost parameters
# Water consumed per tonne of ammonia: DEA 2050 alkaline electrolysis (renewable fuels sheet
# "1.1 AEC 1 GW", 2050 column) uses 208.33 kg of ultrapure water per MWh of electricity and makes
# 23.148 kg of hydrogen, 9.0 kg of water per kg (stoichiometry 8.94; IEA, The Future of Hydrogen,
# 2019, p. 43: "around 9 litres"), times 0.18 t of hydrogen per tonne of ammonia (sheet 5.4) =
# 1.62 m3/t. Air-cooled plant; losses in water treatment are not counted. Until 15 October 2026
# 1.5 m3/t, which had no source and was below the stoichiometric 1.59 m3/t.
water_usage_m3_per_t_nh3: 1.62
# Baseline desalination cost (coastal reference). In the spatial runs it is also the source price at
# permanent lakes: lake water could be treated more cheaply, but the desalination price is kept
# as a shadow price that protects freshwater for other uses (decision of 7 Oct 2026).
water_cost_baseline_usd_per_m3: 2.0

techs:

 # -----------------
 # Generators
 # -----------------
  solar:
    component_type: generator
    source_note: DEA 2050 Utility-scale PV (sheet "22 Utility-scale PV", 2050 column)
    overnight_cost_per_mw: 290000 # EUR/MW — DEA row 16 col 2050 = 0.29 MEUR/MW
    tech_cost_per_mw: 100000 # pv modules (90k) + inverter (10k) from DEA component lines
    build_cost_per_mw: 190000 # installation (90k) + grid (40k) + soft (30k) + BOP (30k)
    land_use_km2_per_mw: 0.01 # Equator baseline for solar density calibration (100 MW/km² at lat=0); run_global applies latitude-adjusted footprint
    lifetime_years: 40
    fixed_om_fraction: 0.02 # Rounded up DEA excluding land rent (DEA: 4,900/290,000 = 1.7%)
  solar_tracking:
    component_type: generator
    source_note: DEA 2050 Utility-scale PV tracker (sheet "22 Utility-scale PV tracker", 2050 column)
    overnight_cost_per_mw: 350000 # DEA row 16 col 2050 = 0.35 MEUR/MW
    tech_cost_per_mw: 160000 # pv modules (90k) + inverter (10k) + tracker (60k)
    build_cost_per_mw: 190000 # installation (90k) + grid (40k) + soft (30k) + BOP (30k)
    land_use_km2_per_mw: 0.02 # Equator baseline for tracking density calibration (50 MW/km² at lat=0); run_global applies latitude-adjusted footprint
    lifetime_years: 40
    fixed_om_fraction: 0.02 # Rounded up DEA excluding land rent (DEA: 4,900/350,000 = 1.4%)
  wind:
    component_type: generator
    source_note: DEA 2050 Onshore turbines (sheet "20 Onshore turbines", 2050 column; offshore cost premiums applied via finance overrides)
    overnight_cost_per_mw: 872256 # DEA equipment (775,395) + installation (80,327) + grid (16,534), the parts below (DEA's rounded total 0.872 MEUR/MW); excludes land, neighbour settlements, decommissioning
    tech_cost_per_mw: 775395 # equipment line from DEA row 17
    build_cost_per_mw: 96861 # installation/development (80,327) + grid connection (16,534)
    land_use_km2_per_mw: 0.2 # 5 MW/km² density (Salmon et al., 200 km²/GW)
    lifetime_years: 30
    fixed_om_fraction: 0.02 # Rounded up DEA excluding land rent

 # -----------------
 # Links
 # -----------------
  ammonia_synthesis:
    component_type: link
    source_note: DEA 2050 Hydrogen to Ammonia (sheet "5.4 Hydrogen to Ammonia", 2050 column; 0.18889 MEUR2020 per t/day of ammonia output x ASU mark-up 1.09, on the HHV bus)
    # EUR/MW of ammonia on HHV: 188,887 EUR per t/day x 24 / 6.25 MWh/t x 1.09 (DEA's mark-up for
    # an ASU, sheet row 30) = 790,606. DEA's 0.865 MEUR/MW is per MW on LHV (5.24 MWh/t), which the
    # YAML applied to the HHV bus with a mark-up of 1.106 until 14 October 2026 (957,000).
    # The sheet is in 2020 EUR (catalogue update of August 2023); its note I ("2015-EUR") is older.
    # Cost decline to 2050 is from economy of scale (2290 TPD vs 458 TPD in 2030), not tech change.
    overnight_cost_per_mw: 790600 # EUR/MW
    tech_cost_per_mw: 395300 # 50% equipment (DEA row 24)
    build_cost_per_mw: 395300 # 50% installation (DEA row 25)
    land_use_km2_per_mw: 0.0000001 # Minimal
    lifetime_years: 30
    fixed_om_fraction: 0.03 # DEA: 3% of CAPEX
    # Electricity: DEA's synthesis loop takes 0.053 of the total input (0.18 t of hydrogen x
    # 33.3 MWh/t / 0.947 = 6.329 MWh of input per tonne, so 0.3355 MWh/t; the text's Table 1,
    # pp. 212-213, puts it in the syngas and make-up compressor and refrigeration of a 150 bar
    # loop), and the ASU 0.25 MWh per tonne of nitrogen at 0.839 t/t (0.2098 MWh/t): 0.5452 MWh/t,
    # 0.0872 MWh per MWh of ammonia on HHV. The feed arrives at the electrolyser's 30 bar (see the
    # header), so no feed compressor. Until 30 October 2026 0.16 MWh/MWh (1.0 MWh/t), the legacy
    # model's value.
    carriers_in: {power: 0.0872338, hydrogen: 1.13472}
    carriers_out: {ammonia: 1.0}
    overall_efficiency: 0.8183615 # HHV, 1 / (1.13472 + 0.0872338)
    # Operation: minimum load and ramp limits, fractions of capacity per hour (per snapshot
    # under the legacy ramp basis). Minimum load: DEA sheet 5.4, "Minimum operation capacity"
    # 0.2 for 2050 (range 0.1-0.3). Ramps: 20 % of nominal per hour, from manufacturer
    # interviews (Armijo and Philibert 2020, Int. J. Hydrogen Energy 45, p. 1550). Until
    # 14 October 2026 the legacy model's 0.3 and 0.4 (campaign check D9).
    min_load_fraction: 0.2
    ramp_limit_up: 0.2
    ramp_limit_down: 0.2
  electrolysis:
    component_type: link
    source_note: DEA 2050 AEC 1 GW (sheet "1.1 AEC 1 GW", 2050 column; 275 EUR/kW_input x 47.61/39.4 = 332.3k EUR/MW of hydrogen output on HHV)
    # Efficiency: 39.4 kWh/kg (HHV) / 47.61 kWh/kg (row 11, stack + balance of plant) = 0.8276,
    # 0.700 on LHV as in green-caribou. Until 29 October 2026 0.84, the sum of rows 14 and 15 as
    # DEA's note G says; but row 15 (14.12 %) is on the stack-level 43.2 kWh/kg of row 10.
    # Fixed O&M: DEA row 36, 4 % (note S: "Stack replacement costs are not included"); 2 % until
    # 29 October 2026, on the mistaken reading that DEA's 4 % includes replacement. Neither model
    # costs stack replacement (row 23: every 101,500 h; row 27: 65.5 EUR/kW stack).
    overnight_cost_per_mw: 332300 # EUR/MW_H2_out — DEA 275,000 EUR/MW_input x 1.2084
    tech_cost_per_mw: 299070 # 90% equipment share (DEA row 34)
    build_cost_per_mw: 33230 # 10% installation share (DEA row 35)
    land_use_km2_per_mw: 0.0000001 # Minimal
    lifetime_years: 25
    fixed_om_fraction: 0.04 # DEA row 36
    carriers_in: {power: 1.2083785} # 47.61011378 / 39.4 MWh of electricity per MWh of hydrogen (HHV)
    carriers_out: {hydrogen: 1.0}
    overall_efficiency: 0.8275553 # HHV basis, 1 / 1.2083785
  hydrogen_compression:
    component_type: link
    source_note: DEA 2050 H2 storage tanks (sheet "151a Hydrogen Storage - Tanks", 2050 column; "Custom compressor component" 191.43 EUR/kW of hydrogen output on LHV / 1.0634, on the HHV bus, scaled to a 30 bar inlet)
    # DEA's is a five-stage compressor from about 1 bar to the 200 bar tanks. DEA derives its 191.43 EUR/kW
    # on LHV from the compressor row (27), and the sheet's 2030 and 2050 component rows carry the
    # 2020 price update (x 1.0634) twice: each is the 2020 value x a round factor x 1.0634, while
    # the totals (row 24: 21,000 x 1.0634 in 2050) and fixed O&M carry it once. So 191.43 / 1.0634
    # = 180.02 EUR/kW on LHV, x 33.3/39.4 = 152.1 EUR/kW on HHV, all equipment: the sheet's
    # installation row is in the store's build cost. 161.8 from 14 to 29 October 2026.
    # Electricity: DEA's 2050 round trip of 90.24 % (1/0.9024 - 1 = 0.1081 MWh per MWh of
    # hydrogen on LHV, 0.0914 on HHV).
    # Inlet at 30 bar: the electrolyser delivers about 30 bar (see the header), so the cost and
    # the electricity are scaled by isothermal work, ln(200/30) / ln(200) = 0.358, as green-caribou
    # scales DEA's compressor to other pressures: 54,461 EUR/MW and 0.0327 MWh/MWh. With a 1 bar
    # inlet, 152,100 and 0.0914 on 29 October 2026. Until 14 October 2026: 165,300 EUR/MW (the
    # 2030 YAML scaled by DEA's 2050/2030 ratio) with 0.05 MWh/MWh, the Queensland report's
    # 2.016 kWh/kg for a pressurised outlet (campaign check D9).
    # Lifetime and O&M: the compressor row of DEA's component table (151a text, Table 7, p. 107
    # of the catalogue), as in green-caribou; the sheet's 30 years (2030-2050) is the lifetime of
    # the whole storage system. 20 years and 2 % until 30 October 2026, carried over from the
    # 2030 YAML without a source.
    overnight_cost_per_mw: 54461 # EUR/MW, 152,100 x 0.358
    tech_cost_per_mw: 54461 # compressor component
    build_cost_per_mw: 0 # installation is in compressed_hydrogen_store's build cost
    land_use_km2_per_mw: 0.0000001 # Minimal
    lifetime_years: 25 # DEA 151a Table 7
    fixed_om_fraction: 0.012 # DEA 151a Table 7: 6,000 EUR a year on a 500,000 EUR compressor
    carriers_in: {hydrogen: 1.0, power: 0.0327}
    carriers_out: {hydrogen_storage: 1.0}
    overall_efficiency: 0.9683354 # 1 / 1.0327
  hydrogen_fuel_cell:
    component_type: link
    source_note: fuelCell (no DEA 2050 line available; retains 2030 values) # TODO(data): replace with DEA fuel-cell CAPEX breakdown when available
    overnight_cost_per_mw: 2475000
    tech_cost_per_mw: 1980000 # Estimated 80%
    build_cost_per_mw: 495000 # Estimated 20%
    land_use_km2_per_mw: 0.0000001 # Minimal
    lifetime_years: 20
    fixed_om_fraction: 0.02
    carriers_in: {hydrogen: 2.0}
    carriers_out: {power: 1.0}
    overall_efficiency: 0.5
  hydrogen_from_storage:
    component_type: link
    source_note: hydrogenBufferWithdrawal (pass-through; retains 2030 values)
    overnight_cost_per_mw: 1.00
    tech_cost_per_mw: 0.90
    build_cost_per_mw: 0.10
    land_use_km2_per_mw: 0.0000001 # Minimal
    lifetime_years: 20
    fixed_om_fraction: 0.0
    carriers_in: {hydrogen_storage: 1.0}
    carriers_out: {hydrogen: 1.0}
    overall_efficiency: 1.0
  battery_pcs_charge:
    component_type: link
    source_note: DEA 2050 Lithium Ion Battery (power component 72k EUR/MW, row 27; the other project costs are on the energy store, note M)
    # 72,000 EUR per MW of AC power, entered per MW of output (/ 0.96) so that the charging
    # link, sized by its input, costs 72,000 per MW. Until 29 October 2026 132,000 per MW of
    # output: the power component plus half of DEA's other project costs, which scale with
    # energy (note M; row 25's 4-hour system, 192 EUR/kWh = 54 + 72/4 + 120, puts them there).
    overnight_cost_per_mw: 75000 # EUR/MW_out
    tech_cost_per_mw: 75000 # PCS/inverter from DEA row 27
    build_cost_per_mw: 0
    land_use_km2_per_mw: 0.0000001 # Minimal
    lifetime_years: 30 # DEA 2050 row 18
    fixed_om_fraction: 0.029 # DEA: 2.9 % of system cost
    carriers_in: {power: 1.0}
    carriers_out: {power_storage: 0.96} # DEA 2050 AC round-trip 92% → sqrt(0.92) ≈ 0.96 per direction
    overall_efficiency: 0.96
  battery_pcs_discharge:
    component_type: link
    source_note: Battery power conversion system (discharging direction, no capital cost)
    overnight_cost_per_mw: 1.00 # Placeholder as PCS is already costed in charge direction and they are bidirectional
    tech_cost_per_mw: 0.50
    build_cost_per_mw: 0.50
    land_use_km2_per_mw: 0.0000001 # Minimal
    lifetime_years: 30
    fixed_om_fraction: 0.0
    carriers_in: {power_storage: 1.0}
    carriers_out: {power: 0.96} # Matches charge direction
    overall_efficiency: 0.96
  penalty_link:
    component_type: link
    source_note: rampPenaltySlack (unchanged)
    overnight_cost_per_mw: 100000000
    tech_cost_per_mw: 80000000
    build_cost_per_mw: 20000000
    land_use_km2_per_mw: 0.0000001 # Minimal
    lifetime_years: 1
    fixed_om_fraction: 0.0
    carriers_in: {ramp_penalty: 1.0}
    carriers_out: {ramp_penalty_dest: 1.0}
    overall_efficiency: 1.0

 # -----------------
 # Stores
 # -----------------
  accumulated_penalty:
    component_type: store
    source_note: rampPenaltySlack (unchanged)
    overnight_cost_per_mwh: 100000000 # EUR/MWh
    tech_cost_per_mwh: 80000000
    build_cost_per_mwh: 20000000
    land_use_km2_per_mwh: 0.0
    lifetime_years: 1
    fixed_om_fraction: 0.0
  ammonia:
    component_type: store
    source_note: IEA (2019), The Future of Hydrogen, assumptions annex, p. 7, import terminal, USD2017 97 million per tank of 56,700 t of ammonia (20 days of storage); 4 % O&M as for the export terminals; 30-year system life; DEA has no ammonia tank
    # 97e6 / 56,700 t = 1,710.8 USD2017/t x 1/1.1297 EUR/USD (ECB, 2017) x 1.018 x 1.012 x 1.003
    # (euro-area HICP, 2017 to 2020) = 1,564.8 EUR2020/t of capacity = 250.4 EUR/MWh at
    # 6.25 MWh/t: the value and conversion of green-caribou, which since 28 October 2026 takes
    # its ammonia and liquid hydrogen tanks from this one source. The IEA's export-terminal tank
    # costs more per tonne (USD 68 million for 34,100 t).
    # History: 80.3 EUR/MWh on 28 October 2026 (Cesaro 2022, 0.56 USD2019/kg, green-caribou's
    # earlier value); 260 from 14 October (Fletcher et al. 2023, CAEEPR Working Paper 2023-16,
    # 3,000 AUD/t); before that 521.74, Fletcher et al. read as USD with a 25 % build mark-up
    # (campaign check D9).
    overnight_cost_per_mwh: 250.4 # EUR/MWh
    tech_cost_per_mwh: 200.3 # 80 % of the installed cost (estimated split)
    build_cost_per_mwh: 50.1 # 20 %
    land_use_km2_per_mwh: 0.00001
    lifetime_years: 30
    fixed_om_fraction: 0.04
  battery_storage:
    component_type: store
    source_note: DEA 2050 Lithium Ion Battery (energy component 54k + other project costs 120k EUR/MWh, rows 26 and 28; note M)
    overnight_cost_per_mwh: 174000 # EUR/MWh; 114,000 until 29 October 2026 (half the other costs)
    tech_cost_per_mwh: 54000 # Battery energy component from DEA row 26
    build_cost_per_mwh: 120000 # DEA "other project costs" (construction, entrepreneur), row 28
    land_use_km2_per_mwh: 0.00005 # Nominal
    lifetime_years: 30 # DEA 2050 row 18
    fixed_om_fraction: 0.029 # DEA: 2.9% of system cost
    standing_loss_fraction_per_day: 0.001 # DEA 2050 Li-ion: energy losses during storage 0.1 %/day (range 0.05-0.2)
  compressed_hydrogen_store:
    component_type: store
    source_note: DEA 2050 Hydrogen Storage Tanks (sheet "151a Hydrogen Storage - Tanks", 2050 column; tanks + installation rows, per MWh on LHV, on the HHV bus)
    # DEA tanks (10,177) + installation (5,089) = 15,266 EUR per MWh of hydrogen on LHV
    # (33.3 kWh/kg), divided by 1.0634 because the 2050 component rows carry the 2020 price
    # update twice (see hydrogen_compression) = 14,356 = 9,570.6 + 4,785.3, which with the
    # compressor's 7,975.5 sums to the sheet's total of 22,331.4. x 33.3/39.4 = 12,133 per MWh
    # on HHV. 12,900 from 14 to 29 October 2026; 15,300 before (D9). green-caribou takes the
    # same 14,356 on LHV (since 29 October 2026; 13,850 before).
    # Fixed O&M: DEA's system O&M over the system total, 425.36 / 22,331.4 = 1.9 % a year, as in
    # green-caribou; 2 % until 29 October 2026.
    overnight_cost_per_mwh: 12133 # EUR/MWh
    tech_cost_per_mwh: 8089 # Type I tanks, DEA row 28 (10,177 / 1.0634 x 33.3/39.4)
    build_cost_per_mwh: 4044 # Installation, equipment, manhours, DEA row 29 (5,089 / 1.0634 x 33.3/39.4)
    land_use_km2_per_mwh: 0.0001 # Nominal
    lifetime_years: 30
    fixed_om_fraction: 0.019
